<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Dalena 🎂</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1233;--bg2:#4a1d4f;--blush:#ffd9e2;--gold:#ffb547;--paper:#fff8f0;--ink:#3a1f3d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg) 70%);color:var(--blush);font-family:'Fraunces',Georgia,serif;overflow:hidden;
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
 opacity:0;pointer-events:none;transition:opacity 1s}
.screen.on{opacity:1;pointer-events:auto}
h1{font-size:clamp(2.2rem,9vw,4rem);line-height:1.1;margin-bottom:.4em}
p.sub{font-family:'Caveat',cursive;font-size:1.7rem;margin-bottom:1.6rem;color:var(--gold)}
button{font:600 1.15rem 'Fraunces',serif;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:.9em 2em;cursor:pointer;
 animation:pulse 1.8s infinite}
button:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
@keyframes pulse{50%{transform:scale(1.06)}}
#lines p{font-size:clamp(1.3rem,5.5vw,2rem);margin:.5em 0;opacity:0;transition:opacity 1.2s}
#lines p.show{opacity:1}
.stage{position:relative;width:min(80vw,340px);aspect-ratio:3/4}
.polaroid{position:absolute;inset:0;background:var(--paper);padding:12px 12px 64px;border-radius:4px;box-shadow:0 20px 50px #0008;
 opacity:0;transform:rotate(var(--r)) translateY(30px) scale(.94);transition:all 1s}
.polaroid.on{opacity:1;transform:rotate(var(--r)) translateY(0) scale(1)}
.polaroid .ph{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#ffb6c8,#ffcf8a);display:flex;align-items:center;justify-content:center;font-size:4rem}
.polaroid .cap{position:absolute;left:0;right:0;bottom:14px;font-family:'Caveat',cursive;font-weight:700;font-size:1.55rem;color:var(--ink);padding:0 10px}
.dots{display:flex;gap:6px;margin-top:2rem;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff40;transition:.4s}
.dots i.on{background:var(--gold);transform:scale(1.3)}
#msg{font-family:'Caveat',cursive;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.4;max-width:560px;max-height:70vh;overflow-y:auto;white-space:pre-wrap;text-align:left;color:var(--paper)}
#sign{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--gold);margin-top:1.2rem;opacity:0;transition:opacity 1.5s}
#sign.show{opacity:1}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:10;width:46px;height:46px;padding:0;font-size:1.3rem;
 background:#ffffff26;color:var(--blush);animation:none;display:none}
#mute.on{display:block}
@media (prefers-reduced-motion:reduce){button{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<audio id="bgm" src="music/song.mp3" loop preload="auto"></audio>
<button id="mute" aria-label="Mute or unmute music">🔊</button>

<!-- 1: Gift -->
<section class="screen on" id="s1">
  <div style="font-size:5rem" aria-hidden="true">🎁</div>
  <h1>Dalena, someone left something for you</h1>
  <p class="sub">(it's not a bill, I promise)</p>
  <button id="open">Open it</button>
</section>

<!-- 2: Funny lines -->
<section class="screen" id="s2"><div id="lines"></div></section>

<!-- 3: Photos -->
<section class="screen" id="s3">
  <div class="stage" id="stage"></div>
  <div class="dots" id="dots"></div>
</section>

<!-- 4: Message -->
<section class="screen" id="s4">
  <div id="msg"></div>
  <div id="sign"></div>
</section>

<script>
/* ============ EDIT THIS PART ============ */
const HER_NAME = "Dalena";
const MY_NAME  = "Theary";

// Funny opening lines, shown one by one
const LINES = [
  "Happy Birthday,My Lovely Dalena! 🎉",
  "Yes, you are one year older.",
  "No, you don't look it.",
  "(Sorry, for not being there to celebrate with you.)",
  "Anyway... I made you a little something 💗"
];

// Photos: put files in the "photos" folder, then list them here with a caption.
const PHOTOS = [
  { src: "photos/1.jpg", cap: "I really miss you 🥹" },
  { src: "photos/2.jpg", cap: "You, being the cutest" },
  { src: "photos/3.jpg", cap: "The cutest person on earth 😂" },
  { src: "photos/4.jpg", cap: "My favorite person" },
  { src: "photos/5.jpg", cap: "My silly baby" },
  { src: "photos/6.jpg", cap: "Remember I'll be ur comfort place!" },
  { src: "photos/7.jpg", cap: "Just us two, together forever 💗" },
  { src: "photos/8.jpg", cap: "Happy Birthday, my love! 🎂🎉" }
];
const SECONDS_PER_PHOTO = 4;

// Music: put your song at music/song.mp3 (volume from 0 to 1)
const MUSIC_VOLUME = 0.6;

// Paste YOUR personal message between the backticks:
const MESSAGE = `Dalena,

I miss you more than words can say, especially all the hugs, cuddles, and little moments of physical affection that I wish I could have with you right now.
 If I could, I’d give you the biggest, longest hug today and probably wouldn’t want to let go. 🫂💕
  Even though we’re apart now, chasing our own dreams and building our own futures, please know that
   you will always have a special little place in my heart that belongs only to you.
  No matter how far apart we are or how busy life gets, a part of my heart will always be cheering for you, wishing you the best, and hoping that you’re doing okay wherever you are.
   I’ll always be so happy to see you grow, achieve your dreams, and become the person you’ve always wanted to be. `;
/* ========================================= */

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); };

/* Confetti */
const cv = $('cv'), cx = cv.getContext('2d'); let bits = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function confetti(n = 140){
  const cols = ['#ffb547','#ff7aa2','#ffd9e2','#8be0c4','#fff'];
  for(let i=0;i<n;i++) bits.push({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:cols[i%5],r:Math.random()*6});
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.vy+=.35;b.x+=b.vx;b.y+=b.vy;b.r+=.2;cx.fillStyle=b.c;cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);cx.restore()});
  bits = bits.filter(b=>b.y<innerHeight+20);
  requestAnimationFrame(loop);
})();

/* Flow */
const bgm = $('bgm'), muteBtn = $('mute');
function startMusic(){
  bgm.volume = 0;
  bgm.play().then(() => {
    muteBtn.classList.add('on');
    const t = setInterval(() => {
      if (bgm.muted || bgm.volume >= MUSIC_VOLUME - .02) { bgm.volume = Math.min(MUSIC_VOLUME, 1); clearInterval(t); }
      else bgm.volume = Math.min(bgm.volume + .03, 1);
    }, 150);
  }).catch(() => {}); // no music file? the site still works
}
muteBtn.onclick = () => { bgm.muted = !bgm.muted; muteBtn.textContent = bgm.muted ? '🔇' : '🔊'; };

$('open').onclick = async () => {
  startMusic(); confetti(); show('s2');
  const box = $('lines');
  for(const t of LINES){
    const p = document.createElement('p'); p.textContent = t; box.appendChild(p);
    await wait(50); p.classList.add('show'); await wait(2200);
  }
  await wait(800); slideshow();
};

async function slideshow(){
  show('s3');
  const stage = $('stage'), dots = $('dots');
  PHOTOS.forEach((p,i)=>{
    const d = document.createElement('div'); d.className='polaroid';
    d.style.setProperty('--r', (i%2?2.5:-2.5)+'deg');
    const img = new Image(); img.className='ph'; img.alt = p.cap; img.src = p.src;
    img.onerror = () => { const f = document.createElement('div'); f.className='ph'; f.textContent='📸'; img.replaceWith(f); };
    const c = document.createElement('div'); c.className='cap'; c.textContent = p.cap;
    d.append(img,c); stage.appendChild(d);
    dots.appendChild(document.createElement('i'));
  });
  const cards = stage.children, dd = dots.children;
  for(let i=0;i<cards.length;i++){
    cards[i].classList.add('on'); dd[i].classList.add('on');
    await wait(SECONDS_PER_PHOTO*1000);
    cards[i].classList.remove('on'); dd[i].classList.remove('on');
    await wait(600);
  }
  message();
}

async function message(){
  show('s4');
  const m = $('msg');
  for(const ch of MESSAGE){ m.textContent += ch; m.scrollTop = m.scrollHeight; await wait(ch==='\n'?350:45); }
  await wait(600);
  $('sign').textContent = "Happy Birthday. Love, " + MY_NAME + " 💗";
  $('sign').classList.add('show'); confetti(200);
}
</script>
</body>
</html>
